name: Apply RandomX validation integration

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[randomx-validation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply consensus validation changes
        shell: python
        run: |
          from pathlib import Path

          v = Path('src/validation.cpp')
          s = v.read_text()
          if '#include <randomx_pow.h>' not in s:
              s = s.replace('#include <pow.h>\n', '#include <pow.h>\n#include <randomx_pow.h>\n', 1)

          old = '''static bool CheckBlockHeader(const CBlockHeader& block, BlockValidationState& state, const Consensus::Params& consensusParams, bool fCheckPOW = true)\n{\n    // Check proof of work matches claimed amount\n    if (fCheckPOW && !CheckProofOfWork(block.GetHash(), block.nBits, consensusParams))\n        return state.Invalid(BlockValidationResult::BLOCK_INVALID_HEADER, "high-hash", "proof of work failed");\n\n    return true;\n}\n'''
          new = '''static bool CheckBlockHeader(const CBlockHeader& block, BlockValidationState& state, const Consensus::Params& consensusParams, bool fCheckPOW = true)\n{\n    // RandomX PoW is contextual and is checked once pindexPrev is known.\n    (void)block;\n    (void)state;\n    (void)consensusParams;\n    (void)fCheckPOW;\n    return true;\n}\n'''
          if old not in s:
              raise SystemExit('expected CheckBlockHeader body not found')
          s = s.replace(old, new, 1)

          old = '''    // Check proof of work\n    const Consensus::Params& consensusParams = chainman.GetConsensus();\n    if (block.nBits != GetNextWorkRequired(pindexPrev, &block, consensusParams))\n        return state.Invalid(BlockValidationResult::BLOCK_INVALID_HEADER, "bad-diffbits", "incorrect proof of work");\n'''
          new = '''    // Bitcoin difficulty/target rules remain unchanged; RandomX replaces only the PoW function.\n    const Consensus::Params& consensusParams = chainman.GetConsensus();\n    if (block.nBits != GetNextWorkRequired(pindexPrev, &block, consensusParams))\n        return state.Invalid(BlockValidationResult::BLOCK_INVALID_HEADER, "bad-diffbits", "incorrect proof of work");\n    if (!CheckRandomXProofOfWork(block, block.nBits, consensusParams, pindexPrev, nHeight))\n        return state.Invalid(BlockValidationResult::BLOCK_INVALID_HEADER, "high-hash", "proof of work failed");\n'''
          if old not in s:
              raise SystemExit('expected contextual PoW block not found')
          s = s.replace(old, new, 1)
          v.write_text(s)

          h = Path('src/validation.h')
          hs = h.read_text()
          oldh = 'bool HasValidProofOfWork(std::span<const CBlockHeader> headers, const Consensus::Params& consensusParams);'
          newh = 'bool HasValidProofOfWork(std::span<const CBlockHeader> headers, const Consensus::Params& consensusParams, const CBlockIndex* pindexPrev);'
          if oldh not in hs:
              raise SystemExit('expected HasValidProofOfWork declaration not found')
          h.write_text(hs.replace(oldh, newh, 1))

          old = '''bool HasValidProofOfWork(std::span<const CBlockHeader> headers, const Consensus::Params& consensusParams)\n{\n    return std::ranges::all_of(headers,\n                               [&](const auto& header) { return CheckProofOfWork(header.GetHash(), header.nBits, consensusParams); });\n}\n'''
          new = '''bool HasValidProofOfWork(std::span<const CBlockHeader> headers, const Consensus::Params& consensusParams, const CBlockIndex* pindexPrev)\n{\n    if (headers.empty()) return true;\n    if (!pindexPrev) return true;\n\n    std::vector<CBlockIndex> synthetic;\n    synthetic.reserve(headers.size());\n    const CBlockIndex* prev = pindexPrev;\n    for (const CBlockHeader& header : headers) {\n        synthetic.emplace_back(header);\n        CBlockIndex* current = &synthetic.back();\n        current->pprev = prev;\n        current->nHeight = prev->nHeight + 1;\n        if (!CheckRandomXProofOfWork(header, header.nBits, consensusParams, prev, current->nHeight)) return false;\n        prev = current;\n    }\n    return true;\n}\n'''
          if old not in s:
              raise SystemExit('expected HasValidProofOfWork definition not found')
          v.write_text(s.replace(old, new, 1))

          n = Path('src/net_processing.cpp')
          ns = n.read_text()
          old = '''bool PeerManagerImpl::CheckHeadersPoW(const std::vector<CBlockHeader>& headers, Peer& peer)\n{\n    // Do these headers have proof-of-work matching what's claimed?\n    if (!HasValidProofOfWork(headers, m_chainparams.GetConsensus())) {\n'''
          new = '''bool PeerManagerImpl::CheckHeadersPoW(const std::vector<CBlockHeader>& headers, Peer& peer)\n{\n    const CBlockIndex* pindexPrev = nullptr;\n    {\n        LOCK(cs_main);\n        if (!headers.empty()) pindexPrev = m_chainman.m_blockman.LookupBlockIndex(headers.front().hashPrevBlock);\n    }\n\n    // RandomX PoW is contextual; defer unconnecting headers until their predecessor is known.\n    if (!HasValidProofOfWork(headers, m_chainparams.GetConsensus(), pindexPrev)) {\n'''
          if old not in ns:
              raise SystemExit('expected CheckHeadersPoW definition not found')
          n.write_text(ns.replace(old, new, 1))

          d = Path('doc/randomx-consensus-validation.md')
          d.write_text('''# RandomX consensus validation\n\nRandomX replaces SHA-256d only for proof-of-work. CBlockHeader::GetHash() remains the SHA-256d block identifier.\n\nPoW is checked contextually because the RandomX key schedule requires the previous chain state and block height.\n''')
      - name: Commit patched consensus validation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/validation.cpp src/validation.h src/net_processing.cpp doc/randomx-consensus-validation.md
          git diff --cached --quiet && exit 0
          git commit -m "Wire RandomX into contextual PoW validation [randomx-validation]"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
